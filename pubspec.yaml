name: recaller
description: "A Flutter application with Firebase Authentication and Firestore."
publish_to: 'none'

version: 1.5.0+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  image_picker: ^1.1.2
  record: ^5.2.0
  google_sign_in: ^7.2.0
  google_mlkit_text_recognition: ^0.17.1
  google_generative_ai: ^0.4.6
  firebase_app_check: ^0.3.2+10
  cloud_functions: ^5.6.2
  razorpay_flutter: ^1.4.7
  record_web: 1.1.5
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  just_audio: ^0.10.6
  http: ^1.6.0
  path_provider: ^2.1.6
  app_settings: ^9.0.1
  cross_file: ^0.3.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  record_platform_interface: 1.2.0
