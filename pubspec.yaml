name: recaller
description: "A Flutter application with Firebase Authentication and Firestore."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  image_picker: ^1.1.2
  record: ^5.2.0
  google_sign_in: ^7.2.0
  google_mlkit_text_recognition: ^0.17.1
  google_generative_ai: ^0.4.6
  firebase_app_check: ^0.3.2+10
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true