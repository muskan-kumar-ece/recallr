  <!-- Anti-Cache Directives -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">

<body>
  <!-- Razorpay Checkout -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openRazorpayWebCheckout = function(optionsJson, successCallback, errorCallback) {
      try {
        var options = JSON.parse(optionsJson);
        options.handler = function(response) {
          if (successCallback) successCallback(JSON.stringify(response));
        };
        options.modal = {
          ondismiss: function() {
            if (errorCallback) errorCallback("PAYMENT_CANCELLED");
          }
        };
        var rzp = new Razorpay(options);
        rzp.on('payment.failed', function(resp) {
          if (errorCallback) errorCallback(JSON.stringify(resp.error || {}));
        });
        rzp.open();
      } catch (e) {
        if (errorCallback) errorCallback(e.toString());
      }
    };
  </script>

  <script>
    // Force service worker update check on load to prevent stale asset retention
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].update();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
